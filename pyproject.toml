[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latent-factor-recurrent-model"
version = "0.1.0"
description = "Latent Factor Recurrent Model experiments in JAX"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "flax>=0.11.1",
  "huggingface-hub>=0.30.0",
  "jax[cuda13]>=0.10.0",
  "optax>=0.2.8",
  "orbax-checkpoint>=0.11.5",
  "pytest>=9.0.3",
  "wandb>=0.19.0",
]

[project.scripts]
lfrm-train = "lfrm.cli:main"
lfrm-build-sudoku = "lfrm.scripts.build_sudoku_dataset:main"
lfrm-build-maze = "lfrm.scripts.build_maze_dataset:main"
lfrm-build-arc = "lfrm.scripts.build_arc_dataset:main"

[tool.hatch.build.targets.wheel]
only-include = ["lfrm"]
