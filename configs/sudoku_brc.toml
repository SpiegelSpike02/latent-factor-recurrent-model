[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[task]
type = "sudoku"

[model]
model_type = "brc"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 512
dropout_rate = 0.05

[model.brc]
belief_steps = 8
h_cycles = 4
l_cycles = 2
hidden_state_dim = 256
l_layers = 1
num_heads = 8
mlp_ratio = 4
position_encoding = "rope"
rms_norm_eps = 1e-5
rope_theta = 10000.0
# Relative CE weights for belief steps 1..8. The training code normalizes
# this vector, so the values control schedule shape rather than total scale.
step_loss_weights = [
  1, 2, 3, 4, 5, 6, 7, 8,
]
denoise_initial_prob = 0.0
denoise_trajectory_prob = 0.0
denoise_teacher_reveal_prob = 0.25
denoise_mode_weights = [0.30, 0.35, 0.35]
fixed_point_entropy_weight = 0.01
fixed_point_loss_weight = 0.0
context_weight_reg_weight = 0.0

[optimizer]
learning_rate = 1e-4
lr_min_ratio = 0.2
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
lr_warmup_steps = 3000
grad_clip_norm = 1.0

[train]
batch_size = 768
epochs = 10000
log_epochs = 10
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.995

[eval]
batch_size = 8192
epochs = 1000
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 4
prefetch_workers = 2
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "sudoku-brc-belief-dualtime-b768"
mode = "online"
