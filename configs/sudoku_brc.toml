[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[task]
type = "sudoku"

[model]
model_type = "brc"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 512
dropout_rate = 0.0
loss_type = "softmax"

[model.brc]

[model.brc.dynamics]
commit_steps = 48
refine_steps = 4
block_depth = 2
step_loss_schedule = "uniform"

[model.brc.hidden]
hidden_state_dim = 512
num_heads = 8
mlp_ratio = 4
local_kernel = 3
attn_scale = 1.0
local_scale = 1.0
rms_norm_eps = 1e-5

[model.brc.position]
position_encoding = "rope"
rope_theta = 10000.0

[model.brc.halt]
halt_exploration_prob = 0.1
halt_min_steps = 3

[optimizer]
optimizer_type = "adamw"
learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 1.0
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 768
epochs = 50000
log_epochs = 10
train_mode = "step_carry"
seed = 0
checkpoint_dir = "checkpoints"

[train.objective]
halt_loss_weight = 0.5

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 768
nums = 10
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "sudoku-brc-core-c48-r4-d2-b768"
mode = "online"
