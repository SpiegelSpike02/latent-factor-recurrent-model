[data]
dataset_path = "data/maze-30x30-hard-1k-aug"

[task]
type = "maze"

[model]
model_type = "brc"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
dropout_rate = 0.0
loss_type = "softmax"

[model.brc]

[model.brc.dynamics]
q_steps = 16
h_cycles = 3
refine_steps = 4
block_depth = 2
gamma = 0.98
step_loss_schedule = "uniform"

[model.brc.hidden]
hidden_state_dim = 256
num_heads = 8
mlp_ratio = 4
local_kernel = 3
input_scale = 1.0
attn_scale = 1.0
local_scale = 1.0
rms_norm_eps = 1e-5

[model.brc.position]
position_encoding = "rope"
rope_theta = 10000.0

[model.brc.halt]
halt_exploration_prob = 0.1
halt_min_steps = 1

[optimizer]
optimizer_type = "adamw"
learning_rate = 1e-4
lr_min_ratio = 0.1
lr_mid_ratio = 0.2
lr_mid_fraction = 0.2
beta1 = 0.9
beta2 = 0.95
weight_decay = 1.0
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 64
epochs = 10000
log_epochs = 10
train_mode = "step_carry"
seed = 0
checkpoint_dir = "checkpoints"

[train.objective]
halt_loss_weight = 0.5

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 64
nums = 10
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "maze-brc-q-dualtime-16x12x2-b64-adamw"
mode = "online"
