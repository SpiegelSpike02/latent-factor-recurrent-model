[data]
dataset_path = "data/maze-30x30-hard-1k-aug"

[task]
type = "maze"

[model]
model_type = "brc"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
dropout_rate = 0.0
loss_type = "softmax"

[model.brc]
q_steps = 16
h_cycles = 3
l_cycles = 4
hidden_state_dim = 256
l_layers = 2
num_heads = 8
mlp_ratio = 4
local_kernel = 3
input_scale = 0.5
attn_scale = 0.2
local_scale = 0.2
position_encoding = "rope"
rms_norm_eps = 1e-5
rope_theta = 10000.0
halt_exploration_prob = 0.1
step_loss_schedule = "quadratic"

[optimizer]
optimizer_type = "adam_atan2"
learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 1.0
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 768
epochs = 50000
log_epochs = 10
halt_loss_weight = 0.5
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 768
epochs = 5000
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "maze-brc-q-dualtime-16x3x4x2-b768"
mode = "online"
