[data]
dataset_path = "data/maze-30x30-hard-1k-aug"

[task]
type = "maze"

[model]
model_type = "trm"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
rollout_steps = 16
dropout_rate = 0.0
loss_type = "stablemax"

[model.trm]
# Official TRM naming: deep_recursion = H_cycles, latent_recursion = L_cycles,
# block_layers = L_layers. Official Maze attention config uses 3/4/2.
deep_recursion = 3
latent_recursion = 4
block_layers = 2
num_heads = 8
mlp_ratio = 4
mlp_t = false
local_mixing = false
local_mixing_kernel = 3
puzzle_embed_ndim = 512
puzzle_embed_len = 16
position_encoding = "rope"
rms_norm_eps = 1e-5
halt_exploration_prob = 0.1
# Matches official no_ACT_continue=True: halt uses one sigmoid logit, no continue Q loss.
no_act_continue = true


[optimizer]
optimizer_type = "adam_atan2"
learning_rate = 1e-4
puzzle_embed_learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 1.0
puzzle_embed_weight_decay = 1.0
lr_warmup_steps = 2000
grad_clip_norm = 1.0
flatten_optimizer = false

[train]
batch_size = 768
epochs = 50000
log_epochs = 10
trm_train_mode = "act"
halt_loss_weight = 0.5
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 2048
epochs = 5000
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "maze-trm-official-rope-act-stablemax-b768"
mode = "online"
