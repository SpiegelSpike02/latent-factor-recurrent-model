[data]
dataset_path = "data/maze-30x30-hard-1k"

[model]
model_type = "trm"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
num_steps = 16
dropout_rate = 0.05

[model.trm]
h_cycles = 2
l_cycles = 2
l_layers = 4
num_heads = 8
mlp_ratio = 4
mlp_t = false
attention_type = "gated_dual"
local_mixing = false
local_mixing_kernel = 3
puzzle_emb_ndim = 512
puzzle_emb_len = 1
pos_encodings = "rope"
rms_norm_eps = 1e-5
rope_theta = 10000.0
halt_exploration_prob = 0.1

[optimizer]
learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 1.0
warmup_steps = 2000
grad_clip_norm = 1.0
flatten_optimizer = true

[train]
batch_size = 64
eval_batch_size = 128
max_steps = 20000
log_every = 10
eval_every = 2000
eval_batches = 32
trm_train_mode = "act"
dense_loss_weight = 0.0
final_loss_weight = 1.0
sequence_loss_weight = 0.0
sequence_loss_temperature = 0.5
q_loss_weight = 0.5
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.995

[runtime]
compute_dtype = "bfloat16"

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "maze-trm-official-rope-gated-act"
mode = "online"
