[data]
dataset_path = "data/arc1concept-aug-1000"

[task]
type = "arc"

[model]
model_type = "urm"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
dropout_rate = 0.0
loss_type = "stablemax"

[model.urm]
# Official URM ARC script: loops=16, H_cycles=2, L_cycles=6, num_layers=4.
recurrent_steps = 16
h_cycles = 2
l_cycles = 6
l_layers = 4
num_heads = 8
mlp_ratio = 4
conv_kernel = 2
puzzle_embed_ndim = 512
puzzle_embed_len = 1
rms_norm_eps = 1e-5
rope_theta = 10000.0
halt_exploration_prob = 0.1


[optimizer]
optimizer_type = "muon"
learning_rate = 1e-4
puzzle_embed_learning_rate = 1e-2
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
puzzle_embed_weight_decay = 0.1
puzzle_embed_coalesce_updates = true
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 768
epochs = 200000
log_epochs = 10
trm_train_mode = "act"
halt_loss_weight = 0.5
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 768
epochs = 2000
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "arc1-urm-official-rope-act-stablemax-muon-b768"
mode = "online"
