[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[task]
type = "sudoku"

[model]
model_type = "trm"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 512
rollout_steps = 16
dropout_rate = 0.0
loss_type = "stablemax"

[model.trm]
# Official TRM attention config: H_cycles=3, L_cycles=6, L_layers=2,
# mlp_t=false, and RoPE positional encoding.
h_cycles = 3
l_cycles = 6
l_layers = 2
num_heads = 8
mlp_ratio = 4
mlp_t = false
local_mixing = false
local_mixing_kernel = 3
puzzle_embed_ndim = 512
puzzle_embed_len = 16
position_encoding = "rope"
rope_theta = 10000.0
rms_norm_eps = 1e-5
halt_exploration_prob = 0.1
# Matches official no_ACT_continue=True: halt uses one sigmoid logit, no continue Q loss.
no_act_continue = true


[optimizer]
optimizer_type = "adam_atan2"
learning_rate = 1e-4
puzzle_embed_learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 1.0
puzzle_embed_weight_decay = 1.0
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 768
epochs = 50000
log_epochs = 10
trm_train_mode = "act"
halt_loss_weight = 0.5
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 8192
nums = 10
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 4
prefetch_workers = 2
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "sudoku-trm-attn-official-rope-act-stablemax-b768"
mode = "online"
