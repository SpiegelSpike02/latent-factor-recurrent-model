[data]
dataset_path = "data/arc2concept-aug-1000"

[task]
type = "arc"

[model]
model_type = "trm"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
rollout_steps = 16
dropout_rate = 0.0
loss_type = "stablemax"

[model.trm]
# Official TRM ARC config: H_cycles=3, L_cycles=4, L_layers=2.
h_cycles = 3
l_cycles = 4
l_layers = 2
num_heads = 8
mlp_ratio = 4
mlp_t = false
local_mixing = false
local_mixing_kernel = 3
puzzle_embed_ndim = 512
puzzle_embed_len = 16
position_encoding = "rope"
rms_norm_eps = 1e-5
rope_theta = 10000.0
halt_exploration_prob = 0.1
no_act_continue = true


[optimizer]
optimizer_type = "adam_atan2"
learning_rate = 1e-4
puzzle_embed_learning_rate = 1e-2
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
puzzle_embed_weight_decay = 0.1
puzzle_embed_coalesce_updates = true
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 128
epochs = 100000
log_epochs = 10
train_mode = "act"
halt_loss_weight = 0.5
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 128
nums = 10
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "arc2-trm-official-rope-act-stablemax-b768"
mode = "online"
