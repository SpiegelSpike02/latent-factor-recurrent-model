[data]
dataset_path = "data/arc1concept-aug-1000"

[task]
type = "arc"

[model]
model_type = "brc"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
rollout_steps = 16
dropout_rate = 0.0
loss_type = "softmax"

[model.brc]

[model.brc.dynamics]
commit_steps = 48
refine_steps = 4
block_depth = 2
step_loss_schedule = "uniform"
update_step_size = 0.3

[model.brc.objective]
path_energy_weight = 0.0
fixed_point_update_weight = 3e-4
fixed_point_label_smoothing = 3e-3

[model.brc.early_stop]
early_stop_enabled = true
early_stop_min_steps = 4
early_stop_patience = 2
early_stop_distribution_delta_threshold = 1e-3
early_stop_flip_threshold = 0.0
early_stop_margin_threshold = 0.5
early_stop_require_constraints = false

[model.brc.hidden]
hidden_state_dim = 256
num_heads = 8
mlp_ratio = 4
local_kernel = 3
attn_scale = 0.2
local_scale = 0.2
rms_norm_eps = 1e-5

[model.brc.position]
position_encoding = "rope"
rope_theta = 10000.0

[optimizer]
optimizer_type = "adam_atan2"
learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 1.0
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 768
epochs = 100000
log_epochs = 10
train_mode = "step_carry"
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 768
nums = 10
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "arc1-brc-core-c48-r4-d2-b768"
mode = "online"
