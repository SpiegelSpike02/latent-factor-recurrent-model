[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[task]
type = "sudoku"

[model]
model_type = "bdr"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 384
dropout_rate = 0.0
loss_type = "softmax"

[model.bdr]

[model.bdr.dynamics]
commit_steps = 32
refine_steps = 3
block_depth = 2
step_loss_schedule = "uniform"
update_rule = "velocity"
update_step_size = 0.2

[model.bdr.objective]
path_energy_weight = 0.0
fixed_point_update_weight = 0.0
fixed_point_label_smoothing = 3e-3
wrong_attractor_direction_weight = 0.0
wrong_attractor_nonzero_weight = 0.0
wrong_attractor_update_floor = 0.5
corrupted_recovery_weight = 0.0

[model.bdr.early_stop]
early_stop_enabled = true
early_stop_min_steps = 4
early_stop_patience = 2
early_stop_distribution_delta_threshold = 1e-3
early_stop_flip_threshold = 0.0
early_stop_margin_threshold = 0.5
early_stop_require_constraints = true

[model.bdr.hidden]
hidden_state_dim = 384
num_heads = 6
mlp_ratio = 3
local_kernel = 3
attn_scale = 1.0
local_scale = 1.0
rms_norm_eps = 1e-5

[model.bdr.position]
position_encoding = "rope"
rope_theta = 10000.0

[optimizer]
optimizer_type = "adamw"
learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 1.0
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 768
epochs = 50000
log_epochs = 10
train_mode = "step_carry"
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 768
nums = 10
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "sudoku-bdr-velocity-fast-eta02-c32-r3-d2-h384-b768"
mode = "online"
