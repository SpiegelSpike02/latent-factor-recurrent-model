[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[model]
model_type = "lfrm"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 256
num_steps = 32
dropout_rate = 0.05

[model.lfrm]
belief_dim = 9
num_slots = 64
num_heads = 8
latent_processor_layers = 2
symbol_context_mode = "cell_symbol_tokens"
slot_readout_mode = "cell_symbol_attention"
belief_temperature = 1.0
belief_step_size = 0.25
belief_floor = 1e-5
assignment_temperature = 1.0
use_condition_type_embedding = true

[optimizer]
learning_rate = 1.5e-4
weight_decay = 0.01
warmup_steps = 1000
grad_clip_norm = 0.5
flatten_optimizer = true

[train]
batch_size = 64
max_steps = 50000
log_every = 10
eval_every = 500
eval_batches = 32
step_loss_weighting = "uniform"
q_loss_weight = 0.1
terminal_residual_weight = 0.0
slot_consistency_weight = 0.0
slot_usage_weight = 0.0
slot_diversity_weight = 0.0
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = false
decay = 0.999

[runtime]
compute_dtype = "bfloat16"

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "sudoku-lfrm-core"
mode = "online"
