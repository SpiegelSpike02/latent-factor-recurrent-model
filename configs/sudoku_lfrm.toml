[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[model]
model_type = "lfrm"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 384
num_steps = 32
dropout_rate = 0.05

[model.lfrm]
belief_dim = 9
num_slots = 64
num_heads = 8
cell_attention_layers = 1
cell_attention_type = "gated_dual"
l_cycles = 3
latent_processor_layers = 3
symbol_context_mode = "cell_symbol_tokens"
slot_readout_mode = "cell_symbol_attention"
belief_temperature = 1.0
belief_step_size = 0.25
belief_floor = 1e-5
assignment_temperature = 1.0
use_condition_type_embedding = true

[optimizer]
learning_rate = 1.0e-4
weight_decay = 0.02
warmup_steps = 2000
grad_clip_norm = 0.5
flatten_optimizer = true

[train]
batch_size = 64
max_steps = 80000
log_every = 10
eval_every = 500
eval_batches = 32
dense_loss_weight = 0.35
final_loss_weight = 0.65
sequence_loss_weight = 0.05
sequence_loss_temperature = 0.5
q_loss_weight = 0.0
terminal_residual_weight = 0.0
slot_consistency_weight = 0.0
slot_usage_weight = 0.0
slot_diversity_weight = 0.0
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.995

[runtime]
compute_dtype = "bfloat16"

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "sudoku-lfrm-core"
mode = "online"
