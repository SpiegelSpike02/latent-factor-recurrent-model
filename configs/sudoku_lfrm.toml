[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[model]
model_type = "lfrm"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 128
num_steps = 64
dropout_rate = 0.0

[model.lfrm]
belief_dim = 9
num_slots = 64
num_branches = 4
latent_processor_layers = 1
belief_temperature = 1.0
belief_step_size = 0.25
belief_floor = 1e-5
assignment_temperature = 1.0
branch_softmin_temperature = 0.25
energy_hidden_dim = 128
use_condition_type_embedding = true
freeze_conditioned_state = true

[optimizer]
learning_rate = 2e-4
weight_decay = 0.01
warmup_steps = 1000
grad_clip_norm = 0.5
flatten_optimizer = true

[train]
batch_size = 64
max_steps = 20000
log_every = 10
eval_every = 500
eval_batches = 32
step_loss_weighting = "final"
terminal_residual_weight = 0.0
energy_loss_weight = 0.05
energy_margin = 1.0
energy_corruptions = 1
slot_consistency_weight = 0.01
slot_usage_weight = 0.001
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = false
decay = 0.999

[runtime]
compute_dtype = "bfloat16"

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "sudoku-lfrm"
mode = "online"
