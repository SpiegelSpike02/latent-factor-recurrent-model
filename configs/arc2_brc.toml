[data]
dataset_path = "data/arc2concept-aug-1000"

[task]
type = "arc"

[model]
model_type = "brc"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
rollout_steps = 16
dropout_rate = 0.0
loss_type = "stablemax"

[model.brc]
recurrent_steps = 16
refinement_cycles = 1
refinement_steps = 1
block_layers = 1
num_heads = 8
mlp_ratio = 4
position_encoding = "rope"
rms_norm_eps = 1e-5
rope_theta = 10000.0
denoise_initial_prob = 0.4
denoise_teacher_reveal_prob = 0.25
denoise_mode_weights = [0.35, 0.20, 0.30, 0.15]

[optimizer]
optimizer_type = "adam_atan2"
learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
lr_warmup_steps = 2000
grad_clip_norm = 1.0
flatten_optimizer = true

[train]
batch_size = 768
epochs = 100000
log_epochs = 10
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 768
epochs = 10000
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "arc2-brc-canvas-belief-rope-b768"
mode = "online"
