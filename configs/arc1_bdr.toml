[data]
dataset_path = "data/arc1concept-aug-1000"

[task]
type = "arc"

[model]
model_type = "bdr"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
rollout_steps = 16
dropout_rate = 0.0
loss_type = "stablemax"

[model.bdr]

[model.bdr.dynamics]
commit_steps = 16
h_cycles = 2
l_cycles = 6
l_layers = 4
step_loss_schedule = "uniform"
update_rule = "energy_grad"
draft_view = "probability"
prediction_view = "probability"

[model.bdr.hidden]
hidden_state_dim = 512
num_heads = 8
mlp_ratio = 4
local_kernel = 3
attn_scale = 1.0
local_scale = 1.0
rms_norm_eps = 1e-5

[model.bdr.position]
position_encoding = "rope2d"
rope_theta = 10000.0

[optimizer]
optimizer_type = "muon"
learning_rate = 1e-4
puzzle_embed_learning_rate = 1e-2
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
puzzle_embed_weight_decay = 0.1
puzzle_embed_coalesce_updates = true
lr_warmup_steps = 2000
grad_clip_norm = 1.0

[train]
batch_size = 768
epochs = 100000
log_epochs = 10
train_mode = "act"
halt_loss_weight = 0.5
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[eval]
batch_size = 768
nums = 10
diagnostics = false
full_dataset = true

[runtime]
compute_dtype = "bfloat16"
data_parallel_devices = 0
prefetch_depth = 2
prefetch_workers = 1
profile_enabled = false

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "arc1-bdr-energy-grad-rope2d-h2-l6x4-c16-act-stablemax-muon-b768"
mode = "online"
