[data]
dataset_path = "data/arc2concept-aug-1000"

[task]
type = "arc"
supervision = "full_grid"
clamp_given = false

[model]
model_type = "urm"
seq_len = 900
grid_height = 30
grid_width = 30
d_model = 512
dropout_rate = 0.0
loss_type = "stablemax"

[model.urm]
# Official URM ARC script: loops=16, H_cycles=2, L_cycles=6, num_layers=4.
recurrent_steps = 16
deep_recursion = 2
latent_recursion = 6
block_layers = 4
num_heads = 8
mlp_ratio = 4
conv_kernel = 2
puzzle_embed_ndim = 512
puzzle_embed_len = 1
rms_norm_eps = 1e-5
rope_theta = 10000.0
halt_exploration_prob = 0.1


[optimizer]
optimizer_type = "muon"
learning_rate = 1e-4
puzzle_embed_learning_rate = 1e-2
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
puzzle_embed_weight_decay = 0.1
lr_warmup_steps = 2000
grad_clip_norm = 1.0
flatten_optimizer = false

[train]
batch_size = 768
eval_batch_size = 768
epochs = 200000
log_epochs = 10
eval_epochs = 2000
trm_train_mode = "act"
halt_loss_weight = 0.5
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[runtime]
compute_dtype = "bfloat16"

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "arc2-urm-official-rope-act-stablemax-muon"
mode = "online"
