[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[model]
model_type = "recurrent_transformer"
communication_type = "attention"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 256
d_ff = 1024
num_steps = 16
dropout_rate = 0.05

[model.transition]
type = "residual"
hidden_dim = 128

[model.attention]
num_heads = 4

[model.relation]
include_global = true

[model.clues]
use_type_embedding = true
fix_outputs = true
freeze_state = false

[model.compute]
inner_steps = 1
layers_per_step = 1
grad_inner_steps = 1
reinject_input = false

[optimizer]
learning_rate = 3e-4
weight_decay = 0.1
warmup_steps = 200
grad_clip_norm = 1.0

[train]
batch_size = 128
max_steps = 20000
log_every = 10
eval_every = 500
eval_batches = 32
validity_loss_weight = 0.01
step_loss_weighting = "linear"
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = true
decay = 0.999

[runtime]
compute_dtype = "bfloat16"

[wandb]
enabled = true
project = "recurrent-grid-reasoning"
name = "sudoku-recurrent-transformer"
mode = "online"
