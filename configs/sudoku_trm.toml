[data]
dataset_path = "data/sudoku-extreme-1k-aug-1000"

[model]
model_type = "trm"
seq_len = 81
grid_height = 9
grid_width = 9
d_model = 512
num_steps = 16
dropout_rate = 0.05

[model.trm]
h_cycles = 3
l_cycles = 6
l_layers = 2
num_heads = 8
mlp_ratio = 4
mlp_t = false
puzzle_emb_ndim = 0
puzzle_emb_len = 0
pos_encodings = "grid"
rms_norm_eps = 1e-5
rope_theta = 10000.0
halt_exploration_prob = 0.0

[optimizer]
learning_rate = 1e-4
lr_min_ratio = 1.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
warmup_steps = 2000
grad_clip_norm = 0.0
flatten_optimizer = true

[train]
# Dense unroll backprops through all recurrent steps, so it needs a much smaller batch than ACT training.
batch_size = 64
eval_batch_size = 256
max_steps = 50000
log_every = 10
eval_every = 5000
eval_batches = 32
trm_train_mode = "dense_unroll"
dense_loss_weight = 0.5
final_loss_weight = 0.5
q_loss_weight = 0.0
seed = 0
checkpoint_dir = "checkpoints"

[train.ema]
enabled = false
decay = 0.999

[runtime]
compute_dtype = "bfloat16"

[wandb]
enabled = true
project = "latent-factor-recurrent-model"
name = "sudoku-trm-gridpos-dense-unroll-b64"
mode = "online"
